<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KOL 今日待办</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <style>
      body { margin: 0; padding: 14px 16px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fbfcff; }
      .todo-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
      .todo-head h1 { font-size: 18px; margin: 0; }
      .todo-head .sub { font-size: 12px; color: #8b90a0; }
      #todo-window-list { display: flex; flex-direction: column; gap: 8px; }
      .twl-empty { color: #8b90a0; font-size: 14px; padding: 20px 0; text-align: center; }
      .rc-summary-line { font-size: 13px; color: #2c2452; line-height: 1.5; margin: 4px 0 2px; }
      .rc-followup-draft { margin-top: 8px; padding: 10px; background: #f5f7ff; border: 1px solid #d8def0; border-radius: 8px; }
      .rc-followup-draft .fd-target { font-size: 14px; color: #1f2329; line-height: 1.6; white-space: pre-wrap; }
      .rc-followup-draft .fd-cn { font-size: 12px; color: #8a8f99; margin: 6px 0 8px; white-space: pre-wrap; }
      .reminder-group-title { font-size: 13px; font-weight: 700; margin: 12px 0 4px; }
      .twl-toggle { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 4px; padding: 5px 2px; border-radius: 6px; }
      .twl-toggle:hover { background: #eef2ff; }
      .twl-toggle .cw { color: #8b90a0; width: 12px; display: inline-block; }
      .twl-toggle .twl-hint { font-size: 11px; font-weight: 500; color: #9aa3c0; }
      .twl-filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 8px; }
      .twl-chip { font-size: 12px; padding: 4px 11px; border-radius: 14px; border: 1px solid #d8dced; background: #fff; color: #5e6470; cursor: pointer; }
      .twl-chip:hover { border-color: #b9c2e0; }
      .twl-chip.on { background: #1456f0; border-color: #1456f0; color: #fff; }
      .twl-chip .n { opacity: .7; margin-left: 3px; }
    </style>
  </head>
  <body>
    <div class="todo-head">
      <div>
        <h1>🔔 该处理的红人</h1>
        <div class="sub" id="todo-window-sub"></div>
      </div>
      <button id="todo-window-refresh" class="status archive-entry">刷新</button>
    </div>
    <div id="todo-window-filters" class="twl-filters"></div>
    <div id="todo-window-list" class="reminder-list"></div>
    <script src="reminders.js"></script>
  </body>
</html>
